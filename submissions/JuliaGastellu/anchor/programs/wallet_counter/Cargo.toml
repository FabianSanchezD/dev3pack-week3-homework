[package]
name = "wallet_counter"
version = "0.1.0"
description = "Practico PDAs y permisos con un contador por wallet"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "wallet_counter"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
